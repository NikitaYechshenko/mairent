<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">MaiRent system architecture</title>
  <desc id="desc">Logical architecture showing users, Cloudflare, Nginx, frontend, FastAPI, data services, import workflow and observability.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9z" fill="#77817c"/></marker>
    <style>
      .title{font:700 33px Arial,Helvetica,sans-serif;fill:#20231f}.sub{font:18px Arial,Helvetica,sans-serif;fill:#6b6d67}.label{font:700 16px Arial,Helvetica,sans-serif;fill:#20231f}.small{font:14px Arial,Helvetica,sans-serif;fill:#50564f}.group{font:700 15px Arial,Helvetica,sans-serif;fill:#647069;letter-spacing:1.7px}.line{stroke:#77817c;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#77817c;stroke-width:2.5;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="1040" fill="#f8f6f0"/>
  <text x="55" y="65" class="title">MaiRent · logical system architecture</text>
  <text x="55" y="98" class="sub">Production platform, import workflow, and operations — simplified for public documentation</text>
  <rect x="55" y="130" width="1330" height="720" rx="15" fill="#fffdf8" stroke="#d8d0c3"/>
  <text x="80" y="164" class="group">REQUEST PATH &amp; APPLICATION CORE</text>
  <path d="M220 295 H295" class="line"/><path d="M440 295 H515" class="line"/><path d="M660 245 H735" class="line"/><path d="M660 345 H735" class="line"/>
  <path d="M900 230 H965" class="line"/><path d="M900 305 H965" class="line"/><path d="M900 380 H965" class="line"/>
  <rect x="80" y="245" width="140" height="100" rx="12" fill="#e7f0ea" stroke="#165f43"/><text x="150" y="283" text-anchor="middle" class="label">Renters</text><text x="150" y="306" text-anchor="middle" class="small">owners · agents</text>
  <rect x="295" y="245" width="145" height="100" rx="12" fill="#eaf1fb" stroke="#3971b8"/><text x="367" y="278" text-anchor="middle" class="label">Cloudflare</text><text x="367" y="301" text-anchor="middle" class="small">WAF · CDN · TLS</text><text x="367" y="322" text-anchor="middle" class="small">edge cache</text>
  <rect x="515" y="245" width="145" height="100" rx="12" fill="#f8eee4" stroke="#c56b25"/><text x="587" y="280" text-anchor="middle" class="label">Nginx gateway</text><text x="587" y="305" text-anchor="middle" class="small">reverse proxy</text>
  <rect x="735" y="190" width="165" height="110" rx="12" fill="#e7f0ea" stroke="#165f43"/><text x="817" y="228" text-anchor="middle" class="label">Next.js 15</text><text x="817" y="251" text-anchor="middle" class="small">React · SSR · i18n</text><text x="817" y="272" text-anchor="middle" class="small">MapLibre · SEO</text>
  <rect x="735" y="320" width="165" height="110" rx="12" fill="#e7f0ea" stroke="#165f43"/><text x="817" y="358" text-anchor="middle" class="label">FastAPI</text><text x="817" y="381" text-anchor="middle" class="small">handlers → services</text><text x="817" y="402" text-anchor="middle" class="small">→ repositories</text>
  <rect x="965" y="180" width="170" height="100" rx="12" fill="#fff3d4" stroke="#c78d16"/><text x="1050" y="218" text-anchor="middle" class="label">PostgreSQL</text><text x="1050" y="241" text-anchor="middle" class="small">PostGIS · listings</text><text x="1050" y="262" text-anchor="middle" class="small">users · polygons</text>
  <rect x="965" y="305" width="170" height="100" rx="12" fill="#fff3d4" stroke="#c78d16"/><text x="1050" y="345" text-anchor="middle" class="label">Redis</text><text x="1050" y="368" text-anchor="middle" class="small">cache · rate limit · OTP</text>
  <rect x="965" y="430" width="170" height="100" rx="12" fill="#fff3d4" stroke="#c78d16"/><text x="1050" y="468" text-anchor="middle" class="label">Cloudflare R2</text><text x="1050" y="491" text-anchor="middle" class="small">optimized photos</text><text x="1050" y="512" text-anchor="middle" class="small">database backups</text>
  <path d="M817 430 V480 H965" class="line"/><rect x="1195" y="245" width="145" height="100" rx="12" fill="#f1e9fb" stroke="#8758b3"/><text x="1267" y="283" text-anchor="middle" class="label">External APIs</text><text x="1267" y="306" text-anchor="middle" class="small">MapTiler · SEO</text><text x="1267" y="327" text-anchor="middle" class="small">LocationIQ</text><path d="M900 255 H1195" class="dash"/>
  <rect x="80" y="590" width="585" height="215" rx="12" fill="#fbf7fe" stroke="#c2a4dc"/><text x="110" y="625" class="group">TELEGRAM IMPORT &amp; MODERATION</text>
  <rect x="105" y="655" width="115" height="105" rx="10" fill="#f1e9fb" stroke="#8758b3"/><text x="163" y="695" text-anchor="middle" class="label">Channels</text><text x="163" y="718" text-anchor="middle" class="small">Telegram</text>
  <rect x="270" y="655" width="125" height="105" rx="10" fill="#f1e9fb" stroke="#8758b3"/><text x="332" y="690" text-anchor="middle" class="label">Listener</text><text x="332" y="713" text-anchor="middle" class="small">albums · pHash</text><text x="332" y="734" text-anchor="middle" class="small">deduplication</text>
  <rect x="445" y="655" width="90" height="105" rx="10" fill="#f1e9fb" stroke="#8758b3"/><text x="490" y="695" text-anchor="middle" class="label">Gemini</text><text x="490" y="718" text-anchor="middle" class="small">extract</text>
  <rect x="570" y="655" width="70" height="105" rx="10" fill="#f1e9fb" stroke="#8758b3"/><text x="605" y="688" text-anchor="middle" class="label">Review</text><text x="605" y="712" text-anchor="middle" class="small">bot</text><text x="605" y="735" text-anchor="middle" class="small">queue</text>
  <path d="M220 707 H270M395 707 H445M535 707 H570" class="line"/><path d="M640 707 H690 V375 H735" class="line"/>
  <rect x="745" y="590" width="595" height="215" rx="12" fill="#fff0ee" stroke="#d6887c"/><text x="775" y="625" class="group">MONITORING &amp; OBSERVABILITY</text>
  <rect x="775" y="655" width="125" height="105" rx="10" fill="#fff0ee" stroke="#d6887c"/><text x="837" y="690" text-anchor="middle" class="label">Prometheus</text><text x="837" y="713" text-anchor="middle" class="small">+ cAdvisor</text><text x="837" y="734" text-anchor="middle" class="small">metrics</text>
  <rect x="955" y="655" width="115" height="105" rx="10" fill="#fff0ee" stroke="#d6887c"/><text x="1012" y="690" text-anchor="middle" class="label">Vector → Loki</text><text x="1012" y="715" text-anchor="middle" class="small">structured logs</text>
  <rect x="1125" y="655" width="85" height="105" rx="10" fill="#fff0ee" stroke="#d6887c"/><text x="1167" y="692" text-anchor="middle" class="label">Grafana</text><text x="1167" y="715" text-anchor="middle" class="small">dashboards</text>
  <rect x="1250" y="655" width="65" height="105" rx="10" fill="#fff0ee" stroke="#d6887c"/><text x="1282" y="685" text-anchor="middle" class="label">Health</text><text x="1282" y="707" text-anchor="middle" class="label">checks</text><text x="1282" y="733" text-anchor="middle" class="small">alerts</text>
  <path d="M900 707 H955M1070 707 H1125" class="line"/><path d="M817 430 V545 H837 V655" class="dash"/><path d="M587 345 V540 H1012 V655" class="dash"/>
  <text x="55" y="920" class="sub">Security: Cloudflare strict TLS · authenticated origin pulls · rate limits · JWT / role-based access</text>
  <text x="55" y="958" class="sub">Operations: scheduled PostgreSQL backups to R2 · independent service checks · Telegram outage and recovery alerts</text>
  <circle cx="1360" cy="930" r="16" fill="#e6893a"/><path d="M1353 930h14M1360 923v14" stroke="#fffdf8" stroke-width="2" stroke-linecap="round"/>
</svg>
